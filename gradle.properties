org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 高德那套 SDK 里还有引用**老的 Support Library** 的地方（`android.support.v4.*`）。
# 我们是 AndroidX，那些类早改名成 `androidx.collection.*` 了，一调到就抛
# NoClassDefFoundError —— 而且往往是被 try/catch 吞掉的静默失败。
# enableJetifier 在构建时把这些引用改写成 androidx.*，专治这个。
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
